<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Insurance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="insurancePage">

        <section class="container">


            <div class="modal">

                <div class="head">

                    <h2>Calculate Your Car Insurance Price</h2>


                </div>

                <div class="body">

                    <form action="">

                        <div class="component">
                            <select id="carModel">
                                <option value="ford mustang">ford mustang</option>
                                <option value="mazda rx7">mazda rx7</option>
                                <option value="nissan r32">nissan r32</option>
                                <option value="toyota supra mk7">toyota supra mk7</option>
                                <option value="bmw e46">bmw e46</option>
                                <option value="rolls royce phantom">rolls royce phantom</option>
                            </select>
                        </div>

                        <div class="component">
                            <select id="carMadeYear" value="">
                            </select>
                        </div>
                        <div class="checkBox">
                            <div>
                                <span>Select Your Insurance Type</span>
                            </div>
                            <div>
                                <label for="basic">basic - third person</label>
                                <input type="checkbox" name="insuranceType" id="basic">
                            </div>
                            <div>
                                <label for="complete">complete - third person with body insurance</label>
                                <input type="checkbox" name="insuranceType" id="complete">
                            </div>

                        </div>
                        
                        <div class="callToAction">
                            <input id="submitForm" type="submit" value="Calculate Price">
                        </div>
                    </form>

                </div>



            </div>


        </section>

        <section class="paymentResault">





        </section>


    </main>



    <script src="app.js"></script>
</body>

</html>
